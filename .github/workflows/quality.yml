name: Lab quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run Python behavior and HTTP tests
        run: python tools/quality.py python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-${{ matrix.python }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  sensitivity:
    name: regression-sensitivity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify tests detect broken payment, ownership and CSRF protections
        run: python tools/quality.py sensitivity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: regression-sensitivity
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  browser:
    name: browser (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [academy, workspace, regressions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Linux browser dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run browser suite group
        run: python tools/quality.py browser --group ${{ matrix.group }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-${{ matrix.group }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    if: always()
    needs: [python, sensitivity, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every suite to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os, sys
          checks = json.loads(os.environ['CHECK_RESULTS'])
          for name, result in checks.items():
              print(name + ': ' + result['result'])
          sys.exit(0 if checks and all(x['result'] == 'success' for x in checks.values()) else 1)
