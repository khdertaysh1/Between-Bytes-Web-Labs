<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101918"><title>Between Bytes · Scenario Academy</title><link rel="stylesheet" href="/academy.css"><script src="/academy.js" defer></script></head><body>
<header><a class="brand" href="/academy">B<span>›</span> <small>BETWEEN BYTES<br>WEB LABS · 0.9.1</small></a><div><a href="/foundations" data-t="foundation"></a><button id="language" type="button">English</button></div></header>
<main><section id="overview"><div class="hero"><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="headline"></h1><p data-t="intro"></p><div class="stats"><div><b>5</b><span data-t="labs"></span></div><div><b>50</b><span data-t="scenarios"></span></div><div><b id="total-done">0</b><span data-t="completed"></span></div></div><div class="hero-code" aria-hidden="true">request<br><em>→ invariant</em><br>→ evidence<br>→ fix</div></div><div class="toolbar"><label><span data-t="search"></span><input id="search" type="search"></label><label><span data-t="sort"></span><select id="sort"><option value="path" data-t="path"></option><option value="advanced" data-t="advancedFirst"></option></select></label></div><nav id="groups" aria-label="Scenario tracks"></nav><p class="note" data-t="limits"></p><div id="cards"></div><p id="no-results" hidden data-t="empty"></p></section>
<section id="room" hidden><a href="/academy" data-t="back"></a><p id="room-meta" class="eyebrow"></p><h1 id="room-title"></h1><p id="scene"></p><details class="case-map" open><summary data-t="caseMap"></summary><nav id="case-navigation" aria-label="Lab cases"></nav></details><h2 id="case-title" class="case-title"></h2><div class="case-controls"><a id="previous-case" data-t="previousCase"></a><a id="next-case" data-t="nextCase"></a></div><div class="room-grid"><aside class="lesson"><article><span class="step">01</span><h2 data-t="invariant"></h2><p id="case-story"></p><h3 data-t="boundary"></h3><p id="cause"></p><ol id="data-flow"></ol></article><article><span class="step">02</span><h2 data-t="investigate"></h2><ol id="steps"></ol><button id="hint" data-t="hint"></button><p id="hint-text" class="note" aria-live="polite"></p></article><details><summary data-t="repair"></summary><p id="fix"></p><h3 data-t="beforeCode"></h3><pre id="bad-code" dir="ltr"></pre><h3 data-t="afterCode"></h3><pre id="fixed-code" dir="ltr"></pre><p data-t="snippetNote"></p><p data-t="fixLimit"></p></details><article><span class="step">03</span><h2 data-t="interpretation"></h2><p id="interpretation"></p><p id="state-note" data-t="stateNote"></p></article><details><summary data-t="report"></summary><p data-t="reportPrompt"></p><textarea id="reflection" rows="5"></textarea><button id="save-reflection" data-t="save"></button></details></aside>
<div class="workspace"><section class="application"><div class="address" id="address"></div><div class="app-heading"><span class="app-logo">N</span><div><h2 id="app-title">Northstar</h2><span id="app-account"></span></div><span class="pill" data-t="fixture"></span></div><div class="app-body"><p id="app-copy"></p><div id="result-summary" class="result-summary" role="status"></div><iframe id="preview" title="Isolated browser preview" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe><div id="browser-evidence" class="note" aria-live="polite"></div></div></section>
<section class="workbench"><div class="workbench-head"><h2 data-t="workbench"></h2><button id="reset" data-t="reset"></button></div><p class="note" id="source-note"></p><div class="input-tools"><button id="normal" data-t="normal"></button><button id="sample" data-t="sample"></button><label><span data-t="mode"></span><select id="mode"><option value="vulnerable" data-t="weak"></option><option value="fixed" data-t="fixed"></option></select></label></div><section id="payload-area" hidden><label><span data-t="payloads"></span><select id="payload-choice"></select></label><p id="payload-note" class="note"></p></section><label for="input" data-t="input"></label><textarea id="input" rows="8" spellcheck="false" dir="ltr"></textarea><details><summary data-t="wireRequest"></summary><pre id="wire-request" dir="ltr"></pre></details><button id="send" class="primary" data-t="send"></button><p id="error" role="alert"></p><div id="http-status" class="http-status" role="status"></div><p id="decision-note" class="note" role="status"></p><details><summary data-t="response"></summary><pre id="response" dir="ltr">{}</pre></details></section>
<section id="readback-panel" class="proof" hidden><div class="workbench-head"><h2 data-t="savedResource"></h2><button id="readback" data-t="readback"></button></div><p class="note" data-t="readbackNote"></p><pre id="saved-resource" dir="ltr">{}</pre></section><section class="proof"><h2 data-t="evidence"></h2><ul id="checks"></ul><code id="flag"></code><p id="proof-note" class="note"></p><button id="export" data-t="export"></button><button id="clear-mark" data-t="clearMark"></button></section></div></div></section><footer data-t="footer"></footer></main></body></html>
